    --red:        #c0392b;
    --highlight:  #e6f1fb;
    --border:     #d0dbe8;
    --shadow:     rgba(28,43,58,0.12);
  }

  /* ── DARK MODE ── */
  body.dark {
    --ink:        #d0e4f4;
    --ink-soft:   #8fb8d8;
    --ink-mute:   #4a6e8a;
    --parchment:  #111a24;
    --parchment2: #172130;
    --parchment3: #1e2d3d;
    --sidebar:    #0c1520;
    --sidebar2:   #152030;
    --sidebar3:   #1a2a3a;
    --gold:       #378add;
    --gold-soft:  #5aaaf0;
    --red:        #e05c4a;
    --highlight:  #0c2d4a;
    --border:     #1e3a52;
    --shadow:     rgba(0,0,0,0.4);
  }
  body.dark #preview-pane       { background: #131e28; border-top-color: #378add; }
  body.dark #preview-header     { background: #111a24; }
  body.dark #preview-body       { background: #131e28; color: #d0e4f4; }
  body.dark #preview-content    { color: #d0e4f4; }
  body.dark .result-card        { background: #172130; border-color: #1e3a52; }
  body.dark .result-card:hover  { background: #1e2d3d; }
  body.dark .result-card.active { background: #0c2d4a; border-left-color: #378add; }
  body.dark .result-card .rc-name { color: #d0e4f4; }
  body.dark #no-selection       { color: #4a6e8a; background: #131e28; }
  body.dark .sort-btn           { background: #172130; border-color: #1e3a52; color: #8fb8d8; }
  body.dark .sort-btn:hover     { border-color: #378add; color: #d0e4f4; }
  body.dark .sort-btn.active    { background: #185fa5; border-color: #378add; color: #fff; }
  body.dark #refine-input       { background: #172130; border-color: #1e3a52; color: #d0e4f4; }
  body.dark #refine-add         { background: #185fa5; color: #fff; }
  body.dark .chip               { background: #1e3a52; border-color: #2a4f70; color: #8fb8d8; }
  body.dark #sum-tooltip        { background: #172130; border-color: #1e3a52; color: #d0e4f4; }
  body.dark #summary-panel      { background: #131e28; border-color: #1e3a52; color: #d0e4f4; }
  body.dark #summary-btn        { background: #172130; border-color: #1e3a52; color: #8fb8d8; }
  body.dark #open-btn           { background: #185fa5; }
  body.dark #cite-panel         { background: #111a24; border-top-color: #1e3a52; }
  body.dark #cite-panel-header  { background: #111a24; }
  body.dark #cite-panel-body    { background: #111a24; }
  body.dark .cite-entry         { border-bottom-color: #1e3a52; color: #8fb8d8; }
  body.dark .cite-badge.case    { background: #0c2d4a; color: #5aaaf0; }
  body.dark .cite-badge.statute { background: #0d2e1a; color: #4caf7a; }
  body.dark .cite-badge.rule    { background: #2a1a08; color: #d4884a; }
  body.dark .sv-entry           { border-bottom-color: #2a4f70; }
  body.dark .sv-entry.sv-active { background: #0c2d4a; }
  body.dark .sv-entry-name      { color: #d0e4f4; }
  body.dark .sv-entry-text      { color: #8fb8d8; }
  body.dark .group-header       { background: #172130; color: #4a6e8a; border-color: #1e3a52; }
  body.dark .preview-tag-pill   { background: #1e3a52; }
  body.dark #search-box         { background: #172130; border-color: #1e3a52; }
  body.dark #q                  { background: #172130; color: #d0e4f4; }
  body.dark #q::placeholder     { color: #4a6e8a; }
  body.dark #dark-toggle        { color: #8fb8d8; }
  body.dark #dark-toggle:hover  { color: #d0e4f4; }

    * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Outfit', sans-serif;
    background: var(--parchment);
    color: var(--ink);
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* ── SIDEBAR ── */
  #sidebar {
    width: 260px;
    min-width: 140px;
    background: var(--sidebar);
    display: flex;
    flex-direction: column;
    border-right: none;
  }

  #sidebar { --ink-mute: #b8cfe0; }

  #sidebar-header {
    padding: 18px 22px 16px;
    border-bottom: 1px solid var(--sidebar3);
  }

  #sidebar-header .logo-line {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 4px;
  }

  #sidebar-header .logo-icon {
    width: 28px; height: 28px;
    background: var(--gold);
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: var(--sidebar);
    font-weight: 600; flex-shrink: 0;
  }

  #sidebar-header h1 {
    font-family: 'Outfit', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    letter-spacing: 0.02em;
  }

  #sidebar-header .subtitle {
    font-size: 11px;
    color: var(--ink-mute);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding-left: 38px;
  }

  /* ── SIDEBAR SCROLLABLE BODY ── */
  #sidebar-body {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  #sidebar-body::-webkit-scrollbar { width: 4px; }
  #sidebar-body::-webkit-scrollbar-track { background: transparent; }
  #sidebar-body::-webkit-scrollbar-thumb { background: var(--sidebar3); border-radius: 2px; }

  /* ── FOLDER SECTION ── */
  #folder-section {
    padding: 16px 0 8px;
  }

  .sidebar-section-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-mute);
    padding: 0 22px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .sidebar-section-label span { opacity: 1; color: #b8cfe0; }

  #folder-sort-btn {
    font-family: 'Outfit', sans-serif; font-size: 9px; font-weight: 600;
    letter-spacing: 0.05em; text-transform: uppercase;
    padding: 2px 6px; border-radius: 3px;
    border: 1px solid var(--sidebar3); background: none;
    color: var(--ink-mute); cursor: pointer; transition: all 0.12s;
    white-space: nowrap; flex-shrink: 0;
  }
  #folder-sort-btn:hover { border-color: var(--gold); color: var(--gold-soft); }

  .folder-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 22px;
    cursor: pointer;
    transition: background 0.12s;
    gap: 8px;
  }

  .folder-item:hover { background: var(--sidebar2); }

  .folder-item.active {
    background: var(--sidebar3);
    border-left: 2px solid var(--gold);
    padding-left: 20px;
  }

  .folder-item .fname {
    font-size: 14px;
    color: #ccc;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    transition: color 0.12s;
  }

  .folder-item:hover .fname,
  .folder-item.active .fname { color: #fff; }

  .folder-item .fcount {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--ink-mute);
    background: var(--sidebar3);
    padding: 1px 6px;
    border-radius: 10px;
    flex-shrink: 0;
  }

  .folder-item.active .fcount {
    background: var(--gold);
    color: var(--sidebar);
  }

  /* ── TAG SECTION ── */
  #tag-section {
    padding: 8px 0 8px;
    border-top: 1px solid var(--sidebar3);
    margin-top: 4px;
  }

  .tag-item {
    display: flex;
    align-items: center;
    padding: 6px 22px;
    cursor: pointer;
    transition: background 0.12s;
    gap: 8px;
  }

  .tag-item:hover { background: var(--sidebar2); }

  .tag-item.active {
    background: var(--sidebar3);
    border-left: 2px solid var(--gold);
    padding-left: 20px;
  }

  .tag-dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .tag-item .tname {
    font-size: 12.5px;
    color: #ccc;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    transition: color 0.12s;
  }

  .tag-item:hover .tname,
  .tag-item.active .tname { color: #fff; }

  .tag-item .tcount {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--ink-mute);
    background: var(--sidebar3);
    padding: 1px 6px;
    border-radius: 10px;
    flex-shrink: 0;
  }

  .tag-item.active .tcount {
    background: var(--gold);
    color: var(--sidebar);
  }

  #sidebar-footer {
    padding: 14px 22px;
    border-top: 1px solid var(--sidebar3);
    font-size: 11px;
    color: var(--ink-mute);
    flex-shrink: 0;
  }

  #status-dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #555;
    margin-right: 6px;
    vertical-align: middle;
    transition: background 0.3s;
  }
  #status-dot.ok  { background: #5a9e6f; }
  #status-dot.err { background: var(--red); }

  /* ── MAIN ── */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── SEARCH BAR ── */
  #search-bar {
    padding: 20px 28px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--parchment);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  #search-wrap {
    flex: 1;
    position: relative;
  }

  #search-wrap .icon {
    position: absolute;
    left: 14px; top: 50%;
    transform: translateY(-50%);
    color: var(--ink-mute);
    font-size: 16px;
    pointer-events: none;
  }

  #q {
    width: 100%;
    padding: 12px 44px 12px 42px;
    font-family: 'Outfit', sans-serif;
    font-size: 15px;
    font-weight: 400;
    color: var(--ink);
    background: #fff;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  #q:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(201,168,76,0.12);
  }

  #q::placeholder { color: var(--ink-mute); }

  #clear-btn {
    position: absolute;
    right: 12px; top: 50%;
    transform: translateY(-50%);
    background: none; border: none;
    color: var(--ink-mute); font-size: 16px;
    cursor: pointer; padding: 4px;
    display: none;
    line-height: 1;
  }
  #clear-btn:hover { color: var(--ink); }

  #search-meta {
    font-size: 12px;
    color: #b8cfe0;
    white-space: nowrap;
    min-width: 80px;
    text-align: right;
  }

  /* ── CONTENT SPLIT ── */
  #content {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  /* ── RESULTS PANE ── */
  #results-pane {
    width: 380px;
    min-width: 180px;
    border-right: none;
    overflow-y: auto;
    background: #e8eff5;
  }

  #results-pane::-webkit-scrollbar { width: 5px; }
  #results-pane::-webkit-scrollbar-track { background: transparent; }
  #results-pane::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ── CHIP BAR ── */
  #chip-bar {
    display: none;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-bottom: 1px solid var(--parchment3);
    background: var(--parchment);
    flex-shrink: 0;
  }
  #chip-bar.visible { display: flex; }

  .chip-label {
    font-size: 10px; color: var(--ink-mute);
    font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase; margin-right: 2px;
  }

  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 8px 3px 10px; border-radius: 20px;
    background: var(--gold); color: var(--sidebar);
    font-size: 11px; font-weight: 600; font-family: 'Outfit', sans-serif;
    cursor: default; animation: chipIn 0.15s ease;
  }
  @keyframes chipIn { from { opacity:0; transform:scale(0.85); } to { opacity:1; transform:scale(1); } }

  .chip-x {
    background: none; border: none; cursor: pointer;
    color: var(--sidebar); font-size: 12px; line-height: 1;
    padding: 0 1px; opacity: 0.7; transition: opacity 0.1s;
  }
  .chip-x:hover { opacity: 1; }

  /* Tag filter chips in chip-bar use the tag's own color */
  .chip-tag {
    color: #fff;
  }
  .chip-tag .chip-x { color: #fff; }

  .clear-all {
    font-size: 11px; color: var(--ink-mute); cursor: pointer;
    background: none; border: none; font-family: 'Outfit', sans-serif;
    text-decoration: underline; padding: 0 4px;
    transition: color 0.12s;
  }
  .clear-all:hover { color: var(--red); }

  /* ── CHIP VARIANTS (include/exclude) ── */
  .chip-inc {
    background: #e8f5e9; color: #1b5e20;
    border: 1px solid #a5d6a7;
  }
  .chip-inc .chip-x { color: #1b5e20; }
  .chip-exc {
    background: #fdecea; color: #b71c1c;
    border: 1px solid #ef9a9a;
  }
  .chip-exc .chip-x { color: #b71c1c; }

  /* ── SORT BAR ── */
  #sort-bar {
    display: none;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-bottom: 1px solid var(--parchment3);
    background: var(--parchment2);
    flex-shrink: 0;
  }
  #sort-bar.visible { display: flex; }

  .sort-label {
    font-size: 11px; color: var(--ink-mute);
    font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase;
  }
  .sort-btn {
    font-size: 11px; font-family: 'Outfit', sans-serif;
    padding: 3px 10px; border-radius: 20px;
    border: 1px solid var(--border); background: #fff;
    color: var(--ink-soft); cursor: pointer; transition: all 0.12s;
  }
  .sort-btn:hover  { border-color: var(--gold); color: var(--ink); }
  .sort-btn.active { background: var(--gold); border-color: var(--gold); color: #fff; font-weight: 600; }
  .sort-btn .arrow { margin-left: 3px; font-size: 9px; }
  .sort-divider { width: 1px; height: 16px; background: var(--border); margin: 0 4px; }

  /* Summary view: preview-pane cards */
  .sv-entry {
    padding: 32px 36px 28px;
    border-bottom: 2px solid #000;
    scroll-margin-top: 0;
  }
  .sv-entry:last-child { border-bottom: none; }
  .sv-entry.sv-active { background: #e6f1fb; }
  .sv-entry-name {
    font-family: 'Crimson Pro', serif;
    font-size: 20px; font-weight: 600;
    color: var(--ink); margin-bottom: 4px; line-height: 1.25;
  }
  .sv-entry-folder {
    font-size: 10px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--gold); margin-bottom: 14px;
  }
  .sv-entry-text {
    font-size: 13px; color: var(--ink-soft); line-height: 1.7;
    white-space: pre-wrap;
  }
  .sv-entry-none {
    font-size: 13px; color: var(--ink-mute); font-style: italic;
  }
  .sv-doc-banner {
    background: var(--parchment2); border: 1px solid var(--border);
    border-radius: 6px; padding: 10px 16px; margin-bottom: 16px;
    font-size: 12px; color: var(--ink-mute);
    display: flex; align-items: center; gap: 10px;
  }
  .sv-doc-banner a {
    color: var(--gold); cursor: pointer; text-decoration: underline;
    font-weight: 600;
  }

  /* ── REFINE BAR ── */
  #refine-bar {
    display: none;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--parchment3);
    background: var(--parchment);
    flex-shrink: 0;
  }
  #refine-bar.visible { display: flex; }

  #refine-toggle {
    display: flex;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .rtoggle-btn {
    font-family: 'Outfit', sans-serif;
    font-size: 11px; font-weight: 600;
    padding: 4px 10px;
    border: none; cursor: pointer;
    background: #fff; color: var(--ink-mute);
    transition: all 0.12s;
    letter-spacing: 0.02em;
  }
  .rtoggle-btn.active-inc { background: #e8f5e9; color: #2e7d32; }
  .rtoggle-btn.active-exc { background: #fdecea; color: #c62828; }

  #refine-input {
    flex: 1;
    font-family: 'Outfit', sans-serif;
    font-size: 13px;
    padding: 5px 10px;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    outline: none;
    background: #fff;
    color: var(--ink);
    transition: border-color 0.15s;
  }
  #refine-input:focus { border-color: var(--gold); }
  #refine-input::placeholder { color: var(--ink-mute); }

  #refine-add {
    font-family: 'Outfit', sans-serif;
    font-size: 12px; font-weight: 600;
    padding: 5px 14px;
    background: var(--gold); color: var(--sidebar);
    border: none; border-radius: 6px;
    cursor: pointer; transition: background 0.12s;
    white-space: nowrap;
  }
  #refine-add:hover { background: var(--gold-soft); }

  /* ── GROUP HEADERS ── */
  .group-header {
    padding: 8px 18px 4px;
    font-size: 10px; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--gold); background: var(--parchment2);
    border-bottom: 1px solid var(--parchment3);
    position: sticky; top: 0; z-index: 1;
  }

  /* ── EMPTY STATE ── */
  #empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 12px;
    color: var(--ink-mute);
    padding: 40px;
    text-align: center;
  }
  #empty-state .big-icon { font-size: 48px; opacity: 0.3; }
  #empty-state .hint { font-size: 13px; line-height: 1.6; }
  #empty-state .hint strong { color: var(--ink-soft); }

  /* ── RESULT CARDS ── */
  .result-card {
    padding: 14px 18px;
    border-bottom: 1px solid var(--parchment3);
    cursor: pointer;
    transition: background 0.1s;
    position: relative;
  }
  .result-card:hover  { background: var(--parchment2); }
  .result-card.active {
    background: #185fa5;
    border-left: 3px solid #0c3d6e;
    padding-left: 15px;
  }
  .result-card.active .rc-name,
  .result-card.active .rc-folder,
  .result-card.active .rc-snippet { color: #fff; }
  .result-card.active .rc-folder { color: rgba(255,255,255,0.7); }
  .rc-folder {
    font-size: 10px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--gold); margin-bottom: 4px;
  }
  .rc-name {
    font-size: 13px; font-weight: 500;
    color: var(--ink); line-height: 1.4; margin-bottom: 4px;
  }
  .rc-snippet {
    font-size: 12px; color: var(--ink-soft);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 4px;
  }
  .rc-snippet mark {
    background: var(--highlight); color: var(--ink);
    border-radius: 2px; padding: 0 1px;
  }

  /* ── INLINE TAG PILLS ON CARDS ── */
  .rc-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 5px;
  }
  .rc-tag-pill {
    display: inline-flex;
    align-items: center;
    padding: 1px 7px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: 600;
    color: #fff;
    letter-spacing: 0.02em;
    opacity: 0.9;
  }

  /* ── PREVIEW PANE ── */
  #preview-pane {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #fff;
  }

  #preview-header {
    padding: 14px 24px 12px;
    border-bottom: 1px solid var(--border);
    border-left: 3px solid #378add;
    background: var(--parchment);
  }

  #preview-header-top {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 10px;
  }

  #preview-header .ph-info { flex: 1; min-width: 0; }

  #preview-folder {
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--gold); margin-bottom: 4px;
  }

  #preview-title {
    font-family: 'Crimson Pro', serif;
    font-size: 18px; font-weight: 600;
    color: var(--ink); line-height: 1.3;
  }

  #open-btn {
    flex-shrink: 0;
    display: flex; align-items: center; gap: 7px;
    padding: 9px 18px;
    background: var(--gold); color: var(--sidebar);
    border: none; border-radius: 7px;
    font-family: 'Outfit', sans-serif;
    font-size: 13px; font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    white-space: nowrap;
  }
  #open-btn:hover    { background: var(--gold-soft); transform: translateY(-1px); }
  #open-btn:active   { transform: translateY(0); }
  #open-btn:disabled { opacity: 0.4; cursor: default; transform: none; }

  /* Summary button */
  #summary-btn {
    flex-shrink: 0;
    font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 500;
    padding: 6px 14px; border-radius: 6px; cursor: pointer; transition: all 0.15s;
    background: var(--parchment2); border: 1px solid var(--border); color: var(--ink-soft);
    margin-right: 6px;
  }
  #summary-btn:hover   { background: var(--parchment3); border-color: var(--gold); color: var(--ink); }
  #summary-btn.active  { background: var(--gold-soft);  border-color: var(--gold); color: var(--ink); }
  #summary-btn:disabled { opacity: 0.4; cursor: default; }

  /* Summary panel */
  #summary-panel {
    display: none; padding: 10px 16px 12px;
    background: var(--parchment2); border-bottom: 1px solid var(--border);
    font-family: 'Crimson Pro', serif; font-size: 15px; line-height: 1.6;
    color: var(--ink-soft); max-height: 220px; overflow-y: auto;
  }
  #summary-panel.visible { display: block; }
  #summary-panel .sum-label {
    font-family: 'Outfit', sans-serif; font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--ink-mute); margin-bottom: 5px;
  }

  /* Hover tooltip */
  #sum-tooltip {
    position: fixed; z-index: 9999; max-width: 340px;
    background: var(--sidebar); color: #c8daea;
    font-family: 'Crimson Pro', serif; font-size: 14px; line-height: 1.55;
    padding: 10px 13px; border-radius: 7px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.35);
    pointer-events: none; opacity: 0; transition: opacity 0.15s;
    white-space: pre-wrap; word-break: break-word;
  }
  #sum-tooltip.visible { opacity: 1; }

  /* ── TAG ROW IN PREVIEW HEADER ── */
  #preview-tag-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 5px;
    min-height: 26px;
  }

  .preview-tag-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px 2px 9px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    color: #fff;
    cursor: default;
    animation: chipIn 0.15s ease;
  }

  .preview-tag-remove {
    background: none; border: none;
    color: rgba(255,255,255,0.75); font-size: 11px;

  }
  .preview-tag-remove:hover { color: #fff; }

  /* ── TAG AUTOCOMPLETE INPUT ── */
  #tag-add-wrap {
    position: relative;
    display: inline-flex;
    align-items: center;
  }

  #tag-add-input {
    font-family: 'Outfit', sans-serif;
    font-size: 11px;
    padding: 2px 8px;
    border: 1.5px dashed var(--border);
    border-radius: 20px;
    outline: none;
    background: transparent;
    color: var(--ink);
    width: 110px;
    transition: border-color 0.15s, background 0.15s, width 0.2s;
  }
  #tag-add-input:focus {
    border-color: var(--gold);
    background: #fff;
    width: 150px;
  }
  #tag-add-input::placeholder { color: var(--ink-mute); }

  #tag-autocomplete {
    display: none;
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    min-width: 160px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 6px;
    box-shadow: 0 4px 12px var(--shadow);
    z-index: 100;
    overflow: hidden;
  }
  #tag-autocomplete.visible { display: block; }

  .tag-ac-item {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 6px 12px;
    font-size: 12px;
    color: var(--ink-soft);
    cursor: pointer;
    transition: background 0.08s;
  }
  .tag-ac-item:hover { background: var(--parchment2); }
  .tag-ac-item.new-tag { font-style: italic; color: var(--ink-mute); }
  .tag-ac-item .ac-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  /* ── PREVIEW BODY ── */
  #preview-body {
    flex: 1;
    overflow-y: auto;
    padding: 28px 32px;
  }
  #preview-body::-webkit-scrollbar { width: 5px; }
  #preview-body::-webkit-scrollbar-track { background: transparent; }

  #preview-content {
    font-family: 'Crimson Pro', serif;
    font-size: 16px;
    line-height: 1.8;
    color: var(--ink);
    word-break: break-word;
  }
  #preview-content p         { margin: 0 0 0.5em 0; }
  #preview-content p.sp      { margin: 0; line-height: 0.6; }
  #preview-content p.spaced  { margin-top: 1.2em; margin-bottom: 0.5em; }
  #preview-content h1 { font-family: 'Outfit', sans-serif; font-size: 18px; font-weight: 600; color: var(--ink); margin: 1.4em 0 0.4em; }
  #preview-content h2 { font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 600; color: var(--ink); margin: 1.2em 0 0.3em; }
  #preview-content h3 { font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 600; color: var(--ink-soft); margin: 1em 0 0.3em; }
  #preview-content strong { font-weight: 700; color: var(--ink); }
  #preview-content em  { font-style: italic; }
  #preview-content u   { text-decoration: underline; }
  #preview-content mark { background: var(--highlight); color: var(--ink); border-radius: 2px; padding: 0 2px; }

  #no-selection {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 10px;
    color: var(--ink-mute);
    font-family: 'Crimson Pro', serif;
    font-size: 18px;
    font-style: italic;
    opacity: 0.5;
  }

  .loading-ring {
    width: 20px; height: 20px;
    border: 2px solid var(--border);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-notice {
    background: #fff5f5;
    border: 1px solid #fca5a5;
    border-radius: 8px;
    padding: 16px 20px;
    margin: 20px;
    font-size: 13px;
    color: var(--red);
    line-height: 1.6;
  }

  /* ── DRAG HANDLES ── */
  .drag-handle {
    width: 5px;
    flex-shrink: 0;
    cursor: col-resize;
    background: transparent;
    position: relative;
    z-index: 10;
    transition: background 0.15s;
    user-select: none;

    border-right: 1px solid var(--border);

  .drag-handle.dragging { background: var(--gold); }

    content: '';
    position: absolute;
    top: 0; bottom: 0;
    left: -3px; right: -3px;

  /* ── CITATION LINKS IN PREVIEW ── */
  #preview-content a.cite-link {
    color: inherit; text-decoration: none;
    border-bottom: 1.5px solid var(--gold);

  }
  #preview-content a.cite-link:hover { color: var(--gold); border-bottom-color: var(--gold-soft); }
  #preview-content a.cite-link.cite-lexis { border-bottom-color: #7c6fbf; }
  #preview-content a.cite-link.cite-lexis:hover { color: #7c6fbf; }

  /* ── CITATION PANEL ── */

  #cite-panel-header {
    display: flex; align-items: center; gap: 10px; padding: 8px 20px;
    border-bottom: 1px solid var(--border); background: var(--parchment2);

  }
  #cite-panel-header:hover { background: var(--parchment3); }

    font-size: 11px; font-weight: 700; letter-spacing: 0.08em;

  #cite-panel-body::-webkit-scrollbar { width: 4px; }
  #cite-panel-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    display: flex; align-items: baseline; gap: 8px;

  }

  .cite-badge {
    font-size: 9px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;

  }
  .cite-badge.case    { background: #e8f0fb; color: #2c5fa8; }

  .cite-key {
    font-family: 'Crimson Pro', serif; font-size: 13.5px; color: var(--ink-soft);

    cursor: pointer;

  .cite-name-input {
    font-family: 'Crimson Pro', serif; font-size: 13.5px; color: var(--ink);
    flex: 1; min-width: 0; border: 1.5px solid var(--gold); border-radius: 4px;
    padding: 1px 6px; outline: none; background: #fff;
  }
  .cite-name-save {
    font-size: 10px; font-family: 'Outfit', sans-serif; padding: 2px 7px;

  }
  .cite-name-cancel {
    font-size: 10px; font-family: 'Outfit', sans-serif; padding: 2px 6px;

  }
  .cite-add-em-btn {
    font-size: 10px; font-family: 'Outfit', sans-serif; padding: 2px 7px;
    border-radius: 4px; border: 1px solid var(--border); background: none;
    color: var(--ink-mute); cursor: pointer; flex-shrink: 0; transition: all 0.12s;
    white-space: nowrap;
  }
  .cite-add-em-btn:hover { border-color: var(--gold); color: var(--ink); }
  .cite-open-btn {
    font-size: 11px; font-family: 'Outfit', sans-serif; padding: 2px 8px;
    border-radius: 4px; border: 1px solid var(--border); background: #fff;
    color: var(--ink-soft); cursor: pointer; flex-shrink: 0;
    transition: all 0.12s; text-decoration: none; display: inline-block;
  }
  .cite-open-btn:hover { border-color: var(--gold); color: var(--ink); }
  .cite-edit-btn {
    font-size: 11px; font-family: 'Outfit', sans-serif; padding: 2px 7px;
    border-radius: 4px; border: 1px solid var(--border); background: none;
    color: var(--ink-mute); cursor: pointer; flex-shrink: 0; transition: all 0.12s;
  }
  .cite-edit-btn:hover { border-color: var(--gold); color: var(--ink); }
  .cite-edit-popover {
    display: none; position: fixed; z-index: 200; background: #fff;
    border: 1.5px solid var(--border); border-radius: 10px;

  }
  .cite-edit-popover.open { display: block; }
  .cep-title { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-mute); margin-bottom: 10px; }
  .cep-key   { font-family: 'Crimson Pro', serif; font-size: 14px; color: var(--ink); margin-bottom: 12px; line-height: 1.4; }
  .cep-label { font-size: 11px; font-weight: 600; color: var(--ink-mute); margin-bottom: 4px; }
  .cep-input {
    width: 100%; font-family: 'Outfit', sans-serif; font-size: 12px;
    padding: 7px 10px; border: 1.5px solid var(--border); border-radius: 6px;
    outline: none; color: var(--ink); margin-bottom: 12px; transition: border-color 0.15s;
  }
  .cep-input:focus { border-color: var(--gold); }
  .cep-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .cep-save {
    font-family: 'Outfit', sans-serif; font-size: 12px; font-weight: 600;
    padding: 6px 16px; background: var(--gold); color: var(--sidebar);
    border: none; border-radius: 6px; cursor: pointer; transition: background 0.12s;
  }
  .cep-save:hover { background: var(--gold-soft); }
  .cep-cancel {
    font-family: 'Outfit', sans-serif; font-size: 12px; padding: 6px 12px;
    background: none; border: 1px solid var(--border); border-radius: 6px;
    color: var(--ink-mute); cursor: pointer; transition: all 0.12s;
  }
  .cep-cancel:hover { border-color: var(--ink-mute); color: var(--ink); }
  .cep-reset {
    font-family: 'Outfit', sans-serif; font-size: 12px; padding: 6px 12px;

  .cep-msg { font-size: 11px; margin-top: 8px; text-align: right; min-height: 14px; color: #2e7d32; }
  .cep-msg.err { color: var(--red); }
  .cep-divider { border: none; border-top: 1px solid var(--border); margin: 10px 0 8px; }
  #cite-legend { display: flex; gap: 14px; align-items: center; padding: 0 6px; }
  .legend-item { display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--ink-mute); }
  .legend-dot  { width: 6px; height: 6px; border-radius: 50%; }
  /* Service toggle button */
  #cite-service-toggle {
    display: flex; align-items: center; gap: 5px;
    padding: 2px 8px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--parchment3); cursor: pointer; user-select: none;
    font-size: 10px; font-weight: 700; letter-spacing: 0.06em;
    color: var(--ink-mute); white-space: nowrap; flex-shrink: 0;
    transition: background 0.15s, color 0.15s;
  }
  #cite-service-toggle:hover { background: var(--gold); color: var(--ink); }
  </style>
</head>
<body>

<!-- SIDEBAR -->
<div id="sidebar">
  <div id="sidebar-header">
    <div class="logo-line">
      <div class="logo-icon">⚖</div>
      <h1>Workup Search</h1>
      <button id="dark-toggle" onclick="toggleDark()" title="Toggle dark mode" style="margin-left:auto;background:none;border:none;cursor:pointer;font-size:16px;padding:2px 4px;color:var(--ink-mute);transition:color 0.15s;">🌙</button>
    </div>
    <div class="subtitle">LA Superior Court</div>
  </div>

  <div id="sidebar-body">

    <!-- MOTION TYPES -->
    <div id="folder-section">
      <div class="sidebar-section-label">
        Motion Types <span>— <span id="total-count">—</span> docs</span>
        <button id="folder-sort-btn" title="Toggle sort order" onclick="toggleFolderSort()">A–Z</button>
      </div>
      <div id="folder-list"></div>
    </div>

    <!-- TAGS -->
    <div id="tag-section">
      <div class="sidebar-section-label" style="padding-bottom:6px;">
        Tags
      </div>
      <div id="tag-list">
        <div style="padding:6px 22px;font-size:11px;color:var(--ink-mute);font-style:italic;">
          No tags yet
        </div>
      </div>
    </div>

  </div><!-- /sidebar-body -->

  <div id="sidebar-footer">
    <span id="status-dot"></span>
    <span id="status-text">Connecting…</span>
  </div>
</div>

<div class="drag-handle" id="handle-sidebar" title="Drag to resize"></div>

<!-- MAIN -->
<div id="main">

  <!-- SEARCH BAR -->
  <div id="search-bar">
    <div id="search-wrap">
      <span class="icon">🔍</span>
      <input id="q" type="text" placeholder='Search case names, parties, legal standards… use "quotes" for exact phrase' autocomplete="off" spellcheck="false">
      <button id="clear-btn" onclick="clearSearch()" title="Clear">✕</button>
    </div>
    <div id="search-meta"></div>
  </div>

  <!-- CONTENT -->
  <div id="content">

    <!-- RESULTS -->
    <div id="results-pane" style="display:flex;flex-direction:column;">
      <div id="chip-bar"></div>
      <div id="sort-bar">
        <span class="sort-label">Sort by</span>
        <button class="sort-btn active" id="sort-date" onclick="setSort('date')">Date <span class="arrow" id="arrow-date">↓</span></button>
        <button class="sort-btn" id="sort-name" onclick="setSort('name')">Name <span class="arrow" id="arrow-name"></span></button>
        <button class="sort-btn" id="sort-length" onclick="setSort('length')">Length <span class="arrow" id="arrow-length"></span></button>
        <div class="sort-divider"></div>
        <button class="sort-btn" id="sort-group" onclick="toggleGroup()">Group by Type</button>
        <div class="sort-divider"></div>
        <button class="sort-btn" id="sort-sumview" onclick="toggleSummaryView()">&#x1F4CB; Summary View</button>
      </div>
      <div id="refine-bar">
        <div id="refine-toggle">
          <button class="rtoggle-btn active-inc" id="rtoggle-inc" onclick="setRefineMode('inc')">+ Include</button>
          <button class="rtoggle-btn" id="rtoggle-exc" onclick="setRefineMode('exc')">− Exclude</button>
        </div>
        <input id="refine-input" type="text" placeholder="Narrow results by word or phrase…" autocomplete="off" spellcheck="false">
        <button id="refine-add" onclick="addRefineTerm()">Add</button>
      </div>
      <div id="results-list" style="flex:1;overflow-y:auto;">
        <div id="empty-state">
          <div class="big-icon">📄</div>
          <div class="hint">
            Type a search term above to find documents.<br>
            Try <strong>case numbers</strong>, <strong>party names</strong>,<br>
            or <strong>legal standards</strong>.
          </div>
        </div>
      </div>
    </div><!-- /results-pane -->

    <div class="drag-handle" id="handle-results" title="Drag to resize"></div>

    <!-- PREVIEW -->
    <div id="preview-pane">
      <div id="no-selection">Select a result to preview</div>
    </div>

  </div>
</div>

<script>
const API = 'http://localhost:54321';

// ── DARK MODE ─────────────────────────────────────────────
function toggleDark() {
  const dark = document.body.classList.toggle('dark');
  localStorage.setItem('wsDarkMode', dark ? '1' : '0');
  document.getElementById('dark-toggle').textContent = dark ? '☀️' : '🌙';
}
(function initDark() {
  if (localStorage.getItem('wsDarkMode') === '1') {
    document.body.classList.add('dark');
    document.addEventListener('DOMContentLoaded', () => {
      const btn = document.getElementById('dark-toggle');
      if (btn) btn.textContent = '☀️';
    });
  }
})();

// ── STATE ─────────────────────────────────────────────────────────────────────
let currentQuery  = '';
let searchTimer   = null;
let activeCard    = null;
let allResults    = [];
let sortKey       = 'date';
let sortDir       = -1;
let groupByType   = false;
let summaryViewActive = false;
let activeFilters = new Set();   // motion-type folder names
let activeTagFilters = new Set(); // tag names (AND logic)
let includeTerms  = [];
let excludeTerms  = [];
let refineMode    = 'inc';

// Citation state
let citePanelCollapsed = true;
let sumTooltipTimer   = null;
let sumTooltipCache   = {};

// -- CITATION SERVICE PREFERENCE --
// 'lexis' | 'westlaw' — which provider's live search URL to build.
const CITE_SERVICES = ['lexis', 'westlaw'];
const CITE_SERVICE_LABELS = { lexis: 'LEXIS', westlaw: 'WLAW' };
const CITE_SERVICE_COLORS = { lexis: '#c0392b', westlaw: '#1a4f8a' };

let citeServicePref = (function() {
  var v = localStorage.getItem('citeServicePref');
  return (v === 'lexis' || v === 'westlaw') ? v : 'lexis';
})();

function saveCiteServicePref(v) {
  try { localStorage.setItem('citeServicePref', v); } catch(e) {}
  citeServicePref = v;
}

function cycleCiteService() {
  var idx = (CITE_SERVICES.indexOf(citeServicePref) + 1) % CITE_SERVICES.length;
  saveCiteServicePref(CITE_SERVICES[idx]);
  updateCiteServiceUI();
  if (window._currentDocCitations && window._currentDocId != null) {
    console.log('[cite-toggle] pref=', citeServicePref, 'sample citation:', JSON.stringify(window._currentDocCitations[0]));
    injectAndRenderCitations(window._currentDocCitations, window._currentDocId);
  }
}

function updateCiteServiceUI() {
  var btn   = document.getElementById('cite-service-toggle');
  var label = document.getElementById('cite-svc-label');
  if (label) label.textContent = CITE_SERVICE_LABELS[citeServicePref] || 'AUTO';
  if (btn) {
    btn.style.background = CITE_SERVICE_COLORS[citeServicePref] || 'var(--parchment3)';
    btn.style.borderColor = CITE_SERVICE_COLORS[citeServicePref] || 'var(--border)';
    btn.style.color = '#fff';
  }
}

function resolvedCiteUrl(c) {
  // Live search URLs only (no stored link cache). provider_lock forces a
  // provider for single-database cites (WL-only / Lexis-only); otherwise the
  // active toggle decides.
  const provider = c.provider_lock || citeServicePref;
  return provider === 'westlaw' ? westlawSearchUrl(c) : lexisSearchUrl(c);
}

// Lookup maps from Code Conversion Chart for service-native search terms
var WL_SEARCH_PREFIX = {
  "BPC":"CA BUS & PROF","COM":"CA COML","CIV":"CA CIVIL","CCP":"CA CIV PRO",
  "CORP":"CA CORP","EDC":"CA EDUC","ELEC":"CA ELEC","EVID":"CA EVID","FAM":"CA FAM",
  "FIN":"CA FIN","FGC":"CA FISH & G","FAC":"CA FOOD & AG","GOV":"CA GOVT",
  "HNC":"CA HARB & NAV","HSC":"CA HLTH & S","INS":"CA INS","LAB":"CA LABOR",

// buildWLTerm / buildLexisTerm handle both internal abbrev keys (e.g. "CCP \u00a7 760.020")
// and workups long-form keys (e.g. "Code Civ. Proc. \u00a7 760.020").
// For long-form keys, extract the code name before the \u00a7 and look it up in
// WORKUPS_SHORT_TO_WL / WORKUPS_SHORT_TO_LEXIS.
function buildWLTerm(key) {
  var m = key.match(/^([A-Z]+)\s*\u00a7\s*(.+)$/);
  if (m) {
    var p = WL_SEARCH_PREFIX[m[1]];
    if (p) return p + ' \u00a7 ' + m[2];
  }
  var m2 = key.match(/^(.+?)\s*\u00a7\u00a7?\s*(.+)$/);
  if (m2) {
    var code = m2[1].trim().replace(/,\s*$/, '');
    var sec  = m2[2].trim();
    var p2 = WORKUPS_SHORT_TO_WL[code];
    if (p2) return p2 + ' \u00a7 ' + sec;
  }
  return key;
}
function buildLexisTerm(key) {
  var m = key.match(/^([A-Z]+)\s*\u00a7\s*(.+)$/);
  if (m) {
    var p = LEXIS_SEARCH_PREFIX[m[1]];
    if (p) return p + ' \u00a7 ' + m[2];
  }
  var m2 = key.match(/^(.+?)\s*\u00a7\u00a7?\s*(.+)$/);
  if (m2) {
    var code = m2[1].trim().replace(/,\s*$/, '');
    var sec  = m2[2].trim();
    var p2 = WORKUPS_SHORT_TO_LEXIS[code];
    if (p2) return p2 + ' \u00a7 ' + sec;
  }
  return key;
}
function lexisSearchUrl(c) {
  // Prefer the extractor's disambiguated term; fall back to native-term
  // building from the key, then the raw key.
  var term = c.lexis_search_term
    || ((c.type === 'statute' || c.type === 'rule') ? buildLexisTerm(c.key) : c.key);
  return 'https://plus.lexis.com/search/?pdmfid=1530671&pdsearchterms=' + encodeURIComponent(term);
}
function westlawSearchUrl(c) {
  // Port of pdf-viewer resolveUrl's Westlaw branch (westlawCaseUrl /
  // westlawStatuteUrl / westlawRuleUrl). Cases use the direct findType=Y link
  // off the bare reporter cite; WL database numbers aren't served by
  // findType=Y, so those route through search instead.
  if (c.type === 'case') {
    var cite = c.westlaw_search_cite || c.key;
    if (/ WL /.test(cite)) {
      return 'https://1.next.westlaw.com/Search/Results.html?query=' + encodeURIComponent(cite) + '&jurisdiction=CA&contentType=CASE';
    }
    return 'https://1.next.westlaw.com/Link/Document/FullText?findType=Y&cite=' + encodeURIComponent(cite);
  }
  if (c.type === 'rule') {
    // Court rules aren't indexed as statutes — no contentType filter.
    var rterm = c.westlaw_search_cite || c.key;
    return 'https://1.next.westlaw.com/Search/Results.html?query=' + encodeURIComponent(rterm) + '&jurisdiction=CA';
  }
  var term = c.westlaw_search_cite || buildWLTerm(c.key);
  return 'https://1.next.westlaw.com/Search/Results.html?query=' + encodeURIComponent(term) + '&jurisdiction=CA&contentType=STATUTE';
}

function resolvedCiteClass(c) {

// ── INIT ──────────────────────────────────────────────────────────────────────
async function init() {
  try {
    const r = await fetch(`${API}/ping`);
    if (!r.ok) throw new Error();
    setStatus(true);
    await Promise.all([loadFolders(), loadTagSidebar()]);
    await loadAll();
  } catch {
    setStatus(false);
  }
  initEditPopover();
}

function setStatus(ok) {
  document.getElementById('status-dot').className = ok ? 'ok' : 'err';
  document.getElementById('status-text').textContent = ok ? 'Connected' : 'Server offline — run app.py';
}

// ── FOLDERS ───────────────────────────────────────────────────────────────────
let folderData   = [];
let folderSortBy = 'alpha'; // 'alpha' | 'count'

async function loadFolders() {
  try {
    folderData = await fetch(`${API}/folders`).then(r => r.json());
    renderFolderList();
  } catch(e) { console.error(e); }
}

function renderFolderList() {
  const list = document.getElementById('folder-list');
  const btn  = document.getElementById('folder-sort-btn');
  const sorted = [...folderData].sort((a, b) =>
    folderSortBy === 'count'
      ? b.count - a.count || a.folder.localeCompare(b.folder)
      : a.folder.localeCompare(b.folder)
  );
  let total = 0;
  list.innerHTML = '';
  sorted.forEach(f => {
    total += f.count;
    const div = document.createElement('div');
    div.className      = 'folder-item';
    div.dataset.folder = f.folder;
    div.onclick        = () => toggleFolderFilter(div);
    if (activeFilters.has(f.folder)) div.classList.add('active');
    div.innerHTML = `<span class="fname">${f.folder}</span><span class="fcount">${f.count}</span>`;
    list.appendChild(div);
  });
  document.getElementById('total-count').textContent = total;
  if (btn) btn.textContent = folderSortBy === 'alpha' ? 'A–Z' : '# ↓';
}

function toggleFolderSort() {
  folderSortBy = folderSortBy === 'alpha' ? 'count' : 'alpha';
  renderFolderList();
}

// ── TAG SIDEBAR ───────────────────────────────────────────────────────────────
async function loadTagSidebar() {
  try {
    const data = await fetch(`${API}/tags`).then(r => r.json());
    allTags = {};
    data.forEach(t => { allTags[t.name] = { color_index: t.color_index, count: t.count }; });
    renderTagSidebar();
  } catch(e) { console.error(e); }
}

function renderTagSidebar() {
  const list = document.getElementById('tag-list');
  const names = Object.keys(allTags).sort();
  if (names.length === 0) {
    list.innerHTML = `<div style="padding:6px 22px;font-size:11px;color:var(--ink-mute);font-style:italic;">No tags yet</div>`;
    return;
  }
  list.innerHTML = '';
  names.forEach(name => {
    const info  = allTags[name];
    const color = tagColor(info.color_index);
    const isActive = activeTagFilters.has(name);
    const div = document.createElement('div');
    div.className = 'tag-item' + (isActive ? ' active' : '');
    div.dataset.tag = name;
    div.onclick = () => toggleTagFilter(div);
    div.innerHTML = `
      <span class="tag-dot" style="background:${color}"></span>
      <span class="tname">${escHtml(name)}</span>
      <span class="tcount">${info.count}</span>`;
    list.appendChild(div);
  });
}

function toggleTagFilter(el) {
  const tag = el.dataset.tag;
  if (activeTagFilters.has(tag)) {
    activeTagFilters.delete(tag);
    el.classList.remove('active');
  } else {
    activeTagFilters.add(tag);
    el.classList.add('active');
  }
  updateChips();
  reloadWithFilters();
}

function removeTagFilter(tag) {
  activeTagFilters.delete(tag);
  document.querySelectorAll('.tag-item').forEach(el => {
    if (el.dataset.tag === tag) el.classList.remove('active');
  });
  updateChips();
  reloadWithFilters();
}

// Re-run current search or browse with active tag filters sent to server
function reloadWithFilters() {
  if (currentQuery) doSearch(currentQuery);
  else loadAll();
}

// ── LOAD ALL DOCS ─────────────────────────────────────────────────────────────
async function loadAll() {
  currentQuery = '';
  const list = document.getElementById('results-list');
  list.innerHTML = '<div style="padding:20px;text-align:center"><div class="loading-ring"></div></div>';
  document.getElementById('sort-bar').classList.add('visible');
  document.getElementById('refine-bar').classList.add('visible');
  try {
    let url = `${API}/browse?folder=all`;
    includeTerms.forEach(t => url += `&inc=${encodeURIComponent(t)}`);
    excludeTerms.forEach(t => url += `&exc=${encodeURIComponent(t)}`);
    activeTagFilters.forEach(t => url += `&tag=${encodeURIComponent(t)}`);
    const resp = await fetch(url);
    if (!resp.ok) {
      const body = await resp.text();
      console.error('Browse failed:', resp.status, body);
      list.innerHTML = `<div class="error-notice">Server error ${resp.status}.<br>Check console (F12) for details.</div>`;
      return;
    }
    allResults = await resp.json();
    renderResults();
  } catch (err) {
    console.error('Browse request failed:', err);
    list.innerHTML = `<div class="error-notice">Browse failed: ${err.message}<br>Check console (F12) for details.</div>`;
  }
}

document.getElementById('q').addEventListener('input', function() {
  clearTimeout(searchTimer);
  const v = this.value.trim();
  document.getElementById('clear-btn').style.display = v ? 'block' : 'none';
  if (!v) { loadAll(); return; }
  searchTimer = setTimeout(() => doSearch(v), 280);
});

document.getElementById('q').addEventListener('keydown', e => {
  if (e.key === 'Escape') clearSearch();
});

function clearSearch() {
  document.getElementById('q').value = '';
  document.getElementById('clear-btn').style.display = 'none';
  currentQuery = '';
  loadAll();
  document.getElementById('q').focus();
}

async function doSearch(query) {
  currentQuery = query;
  const list = document.getElementById('results-list');
  list.innerHTML = '<div style="padding:20px;text-align:center"><div class="loading-ring"></div></div>';
  document.getElementById('search-meta').textContent = '';
  document.getElementById('sort-bar').classList.add('visible');
  document.getElementById('refine-bar').classList.add('visible');
  try {
    let url = `${API}/search?q=${encodeURIComponent(query)}&folder=all`;
    includeTerms.forEach(t => url += `&inc=${encodeURIComponent(t)}`);
    excludeTerms.forEach(t => url += `&exc=${encodeURIComponent(t)}`);
    activeTagFilters.forEach(t => url += `&tag=${encodeURIComponent(t)}`);
    const resp = await fetch(url);
    if (!resp.ok) {
      const body = await resp.text();
      console.error('Search failed:', resp.status, body);
      list.innerHTML = `<div class="error-notice">Server error ${resp.status} for query "${query}".<br>Check the terminal/console for details.</div>`;
      return;
    }
    allResults = await resp.json();
    renderResults();
  } catch (err) {
    console.error('Search request failed:', err);
    list.innerHTML = `<div class="error-notice">Search failed: ${err.message}<br>Check console (F12) for details.</div>`;
  }
}

// ── REFINE BAR ────────────────────────────────────────────────────────────────
function setRefineMode(mode) {
  refineMode = mode;
  document.getElementById('rtoggle-inc').className = 'rtoggle-btn' + (mode === 'inc' ? ' active-inc' : '');
  document.getElementById('rtoggle-exc').className = 'rtoggle-btn' + (mode === 'exc' ? ' active-exc' : '');
  document.getElementById('refine-input').placeholder =
    mode === 'inc' ? 'Keep only results containing…' : 'Remove results containing…';
}

function addRefineTerm() {
  const input = document.getElementById('refine-input');
  const term  = input.value.trim();
  if (!term) return;
  if (refineMode === 'inc') {
    if (!includeTerms.includes(term)) includeTerms.push(term);
  } else {
    if (!excludeTerms.includes(term)) excludeTerms.push(term);
  }
  input.value = '';
  input.focus();
  updateChips();
  // Refetch: term filtering happens server-side for both search and browse
  if (currentQuery) doSearch(currentQuery);
  else loadAll();
}

function removeRefineTerm(term, mode) {
  if (mode === 'inc') includeTerms = includeTerms.filter(t => t !== term);
  else                excludeTerms = excludeTerms.filter(t => t !== term);
  updateChips();
  if (currentQuery) doSearch(currentQuery);
  else loadAll();
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('refine-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') addRefineTerm();
  });
  updateCiteServiceUI();

  // Delegated click handler for inline citation links.
  // Intercepts clicks on <a data-cite-key> links in the preview pane,
  // runs openCitation() to open correct tabs based on toggle + availability.
  // Attached to #preview-pane (always present) rather than #preview-body
  // (created dynamically when a result is selected). Delegation still works
  // because clicks on <a data-cite-key> descendants bubble up to #preview-pane.
  const previewPane = document.getElementById('preview-pane');
  if (previewPane) {
    previewPane.addEventListener('click', e => {
      const a = e.target.closest('a[data-cite-key]');
      if (!a) return;
      const key = a.getAttribute('data-cite-key');
      if (!key || !window._currentDocCitations) return;
      const c = window._currentDocCitations.find(c => c.key === key);
      if (!c) return;
      e.preventDefault();
      openCitation(c);
    });
  }
});

// ── CHIP BAR ──────────────────────────────────────────────────────────────────
function updateChips() {
  const bar   = document.getElementById('chip-bar');
  const total = activeFilters.size + activeTagFilters.size + includeTerms.length + excludeTerms.length;
  bar.innerHTML = '';

  if (total === 0) { bar.classList.remove('visible'); return; }
  bar.classList.add('visible');

  const label = document.createElement('span');
  label.className   = 'chip-label';
  label.textContent = 'Filtering';
  bar.appendChild(label);

  // Motion type chips (gold)
  [...activeFilters].forEach(f => {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.innerHTML = `${escHtml(f)} <button class="chip-x" data-remove="${escHtml(f)}" title="Remove">✕</button>`;
    bar.appendChild(chip);
  });

  // Tag filter chips (tag color)
  [...activeTagFilters].forEach(t => {
    const info  = allTags[t] || { color_index: 0 };
    const color = tagColor(info.color_index);
    const chip  = document.createElement('span');
    chip.className = 'chip chip-tag';
    chip.style.background = color;
    chip.innerHTML = `🏷 ${escHtml(t)} <button class="chip-x chip-tag" data-remove-tag="${escHtml(t)}" title="Remove" style="color:rgba(255,255,255,0.8)">✕</button>`;
    bar.appendChild(chip);
  });

  // Include term chips (green)
  includeTerms.forEach(t => {
    const chip = document.createElement('span');
    chip.className = 'chip chip-inc';
    chip.innerHTML = `+${escHtml(t)} <button class="chip-x" data-remove-inc="${escHtml(t)}" title="Remove">✕</button>`;
    bar.appendChild(chip);
  });

  // Exclude term chips (red)
  excludeTerms.forEach(t => {
    const chip = document.createElement('span');
    chip.className = 'chip chip-exc';
    chip.innerHTML = `−${escHtml(t)} <button class="chip-x" data-remove-exc="${escHtml(t)}" title="Remove">✕</button>`;
    bar.appendChild(chip);
  });

  if (total >= 2) {
    const clearBtn = document.createElement('button');
    clearBtn.className        = 'clear-all';
    clearBtn.dataset.clearAll = '1';
    clearBtn.textContent      = 'Clear all';
    bar.appendChild(clearBtn);
  }
}

// Delegated listener — survives innerHTML rebuilds
document.addEventListener('click', function(e) {
  if (e.target.dataset.remove !== undefined)       removeFilter(e.target.dataset.remove);
  else if (e.target.dataset.removeTag !== undefined) removeTagFilter(e.target.dataset.removeTag);
  else if (e.target.dataset.removeInc !== undefined) removeRefineTerm(e.target.dataset.removeInc, 'inc');
  else if (e.target.dataset.removeExc !== undefined) removeRefineTerm(e.target.dataset.removeExc, 'exc');
  else if (e.target.dataset.clearAll)               clearAllFilters();
});

// ── SORT ──────────────────────────────────────────────────────────────────────
function setSort(key) {
  if (sortKey === key) { sortDir *= -1; }
  // Length and date default to descending (largest/newest first); name defaults to ascending.
  else { sortKey = key; sortDir = (key === 'date' || key === 'length') ? -1 : 1; }
  ['date','name','length'].forEach(k => {
    document.getElementById(`sort-${k}`).classList.toggle('active', k === sortKey);
    const arrow = document.getElementById(`arrow-${k}`);
    if (k === sortKey) arrow.textContent = sortDir === -1 ? '↓' : '↑';
    else arrow.textContent = '';
  });
  renderResults();
}

function toggleGroup() {
  groupByType = !groupByType;
  document.getElementById('sort-group').classList.toggle('active', groupByType);
  renderResults();
}

function extractDate(filename) {
  const m = filename.match(/(\d{1,2})\.(\d{1,2})\.(\d{4})(?:\s*\(\d+\))?\.docx$/i);
  if (m) return new Date(+m[3], +m[1]-1, +m[2]);
  const y = filename.match(/^(\d{2})STCV/i);
  if (y) return new Date(2000 + +y[1], 0, 1);
  return new Date(0);
}

function applyFiltersAndSort(results) {
  // Motion type filter (client-side; tag and include/exclude term filters are
  // applied server-side against full document content — re-filtering here
  // against the 500-char snippet would wrongly drop docs whose match lies
  // deeper in the text)
  let filtered = activeFilters.size > 0
    ? results.filter(r => activeFilters.has(r.folder))
    : results;

  filtered = [...filtered].sort((a, b) => {
    if (groupByType) {
      const fc = a.folder.localeCompare(b.folder);
      if (fc !== 0) return fc;
      return extractDate(b.filename) - extractDate(a.filename);
    }
    if (sortKey === 'date') return sortDir * (extractDate(a.filename) - extractDate(b.filename));
    if (sortKey === 'name') return sortDir * a.filename.localeCompare(b.filename);
    if (sortKey === 'length') return sortDir * ((a.char_count || 0) - (b.char_count || 0));
    return 0;
  });

  return filtered;
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function renderResults() {
  const list  = document.getElementById('results-list');
  const meta  = document.getElementById('search-meta');
  const final = applyFiltersAndSort(allResults);
  const query = currentQuery;

  if (!final.length) {
    list.innerHTML = `
      <div id="empty-state">
        <div class="big-icon">🔎</div>
        <div class="hint">No results${query ? ` for <strong>"${escHtml(query)}"</strong>` : ''}.<br>Try adjusting your search or filters.</div>
      </div>`;
    meta.textContent = '0 docs';
    return;
  }

  meta.textContent = `${final.length} doc${final.length !== 1 ? 's' : ''}`;
  list.innerHTML = '';
  activeCard = null;
  let lastFolder = null;

  final.forEach((r, i) => {
    if (groupByType && r.folder !== lastFolder) {
      lastFolder = r.folder;
      const hdr = document.createElement('div');
      hdr.className   = 'group-header';
      hdr.textContent = r.folder;
      list.appendChild(hdr);
    }

    const card = document.createElement('div');
    card.className        = 'result-card';
    card.dataset.id       = r.id;
    card.dataset.filepath = r.filepath;
    card.dataset.filename = r.filename;
    card.dataset.folder   = r.folder;

    const snipHtml  = query ? highlightTerms(escHtml(r.snippet || ''), queryToTerms(query)) : '';
    const dateVal   = extractDate(r.filename);
    const dateLabel = dateVal > new Date(0)
      ? dateVal.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'})
      : '';
    // Show character count in place of the date when sorting by length.
    // Format with thousands separators for readability.
    const lenLabel = sortKey === 'length'
      ? `${(r.char_count || 0).toLocaleString()} chars`
      : '';
    const rightLabel = lenLabel || dateLabel;

    // Tag pills on card
    const tagPills = (r.tags || []).map(t => {
      const info  = allTags[t] || { color_index: 0 };
      const color = tagColor(info.color_index);
      return `<span class="rc-tag-pill" style="background:${color}">${escHtml(t)}</span>`;
    }).join('');

    card.innerHTML = `
      <div class="rc-folder">${escHtml(r.folder)}${rightLabel ? `<span style="float:right;font-weight:400;color:var(--ink-mute)">${rightLabel}</span>` : ''}</div>
      <div class="rc-name">${escHtml(r.filename.replace(/\.docx$/i, ''))}</div>
      ${snipHtml ? `<div class="rc-snippet">${snipHtml}</div>` : ''}
      ${tagPills  ? `<div class="rc-tags">${tagPills}</div>` : ''}`;

    card.onclick = () => selectResult(card, r, query);

    card.addEventListener('mouseenter', e => {
      clearTimeout(sumTooltipTimer);
      sumTooltipTimer = setTimeout(() => showSumTooltip(r.filepath, e), 400);
    });
    card.addEventListener('mousemove', e => { positionSumTooltip(e); });
    card.addEventListener('mouseleave', () => { clearTimeout(sumTooltipTimer); hideSumTooltip(); });

    list.appendChild(card);

    if (i === 0 && !summaryViewActive) setTimeout(() => selectResult(card, r, query), 0);
  });

  if (summaryViewActive) renderSummaryPane();
}

function toggleSummaryView() {
  summaryViewActive = !summaryViewActive;
  const btn = document.getElementById('sort-sumview');
  if (btn) btn.classList.toggle('active', summaryViewActive);
  if (summaryViewActive) {
    // Render normal card list on left, summary scroll on right
    renderResults();          // re-render left list as normal cards
    renderSummaryPane();      // render summaries in preview pane
  } else {
    // Tear down summary pane, go back to normal no-selection state
    _svObserver && _svObserver.disconnect();
    _svObserver = null;
    _svDocOpen = null;
    document.getElementById('preview-pane').innerHTML = '<div id="no-selection">Select a result to preview</div>';
    renderResults();
  }
}

// Summary view state
let _svObserver = null;   // IntersectionObserver watching sv-entry divs
let _svDocOpen  = null;   // id of the entry currently showing full doc instead of summary

async function renderSummaryPane(scrollToId) {
  const pane = document.getElementById('preview-pane');
  const final = applyFiltersAndSort(allResults);

  // Build container immediately with placeholders - no waiting
  const container = document.createElement('div');
  container.id = 'sv-container';
  container.style.cssText = 'flex:1;overflow-y:auto;';

  final.forEach((r, i) => {
    const entry = document.createElement('div');
    entry.className     = 'sv-entry';
    entry.dataset.id    = r.id;
    entry.dataset.index = i;
    entry.dataset.loaded = '0';

    const name = r.filename.replace(/\.docx$/i, '');
    // Render name/folder immediately; placeholder for summary text
    entry.innerHTML =
      `<div class="sv-entry-name">${escHtml(name)}</div>` +
      `<div class="sv-entry-folder">${escHtml(r.folder)}</div>` +
      `<div class="sv-entry-text sv-placeholder" style="color:var(--ink-mute);font-style:italic">Loading…</div>`;

    container.appendChild(entry);
  });

  pane.innerHTML = '';
  pane.appendChild(container);

  // Scroll to requested entry before observers fire
  if (scrollToId) {
    const target = container.querySelector(`.sv-entry[data-id="${scrollToId}"]`);
    if (target) target.scrollIntoView({ block: 'start' });
  }

  // Lazy loader: fires when an entry enters the viewport
  const lazyLoader = new IntersectionObserver(entries => {
    entries.forEach(async e => {
      if (!e.isIntersecting) return;
      const entry = e.target;
      if (entry.dataset.loaded === '1') return;
      entry.dataset.loaded = '1';
      lazyLoader.unobserve(entry);

      const r = final[parseInt(entry.dataset.index)];
      const sumText = await fetchSummaryText(r.filepath);
      // Replace placeholder with real content
      const ph = entry.querySelector('.sv-placeholder');
      if (ph) {
        ph.className = sumText ? 'sv-entry-text' : 'sv-entry-none';
        ph.style = '';
        ph.textContent = sumText || 'No summary available.';
      }
    });
  }, { root: container, rootMargin: '200px', threshold: 0 });

  // Scroll-sync observer: keeps left panel card in sync
  _svObserver && _svObserver.disconnect();
  _svObserver = new IntersectionObserver(entries => {
    let topEntry = null, topY = Infinity;
    entries.forEach(e => {
      if (e.isIntersecting) {
        const y = e.boundingClientRect.top;
        if (y < topY) { topY = y; topEntry = e.target; }
      }
    });
    if (!topEntry) return;
    const idx = parseInt(topEntry.dataset.index);
    const r   = final[idx];
    document.querySelectorAll('.result-card').forEach(c => c.classList.remove('active'));
    const matchCard = [...document.querySelectorAll('.result-card')]
      .find(c => c.dataset.id == r.id);
    if (matchCard) {
      matchCard.classList.add('active');
      matchCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
    document.querySelectorAll('.sv-entry').forEach(e => e.classList.remove('sv-active'));
    topEntry.classList.add('sv-active');
  }, { root: container, threshold: 0.1 });

  container.querySelectorAll('.sv-entry').forEach(e => {
    lazyLoader.observe(e);
    _svObserver.observe(e);
  });

  _svWireCards(final, container);
}

function _svWireCards(final, container) {
  document.querySelectorAll('.result-card').forEach((card, i) => {
    // Replace onclick entirely for summary-view behaviour
    card.onclick = () => {
      const r = final.find(x => x.id == card.dataset.id);
      if (!r) return;

      // Highlight this card
      document.querySelectorAll('.result-card').forEach(c => c.classList.remove('active'));
      card.classList.add('active');

      const entryEl = container.querySelector(`.sv-entry[data-id="${r.id}"]`);

      if (_svDocOpen === r.id) {
        // Second click: close doc, go back to summary pane scrolled to this entry
        _svDocOpen = null;
        renderSummaryPane(r.id);
      } else {
        // First click: open full document in preview pane
        _svDocOpen = r.id;
        selectResult(card, r, currentQuery);
      }
    };
  });
}



// ── RESULT SELECTION ──────────────────────────────────────────────────────────
async function selectResult(card, r, query) {
  document.querySelectorAll('.result-card').forEach(c => c.classList.remove('active'));
  card.classList.add('active');
  activeCard = card;

  document.getElementById('preview-pane').innerHTML = `
    <div id="preview-header">
      <div id="preview-header-top">
        <div class="ph-info">
          <div id="preview-folder">${escHtml(r.folder)}</div>
          <div id="preview-title">${escHtml(r.filename.replace(/\.docx$/i, ''))}</div>
        </div>
        <button id="summary-btn" onclick="toggleSummaryPanel()" title="Show Copilot summary">&#x1F4CB; Summary</button>
        <button id="open-btn" onclick="openFile()">&#x1F4C2; Open in Word</button>
      </div>
      <div id="preview-tag-row"></div>
      <div id="summary-panel"></div>
    </div>
    <div id="preview-body">
      <div class="loading-ring" style="margin-top:40px"></div>
    </div>
    <div id="cite-panel">
      <div id="cite-panel-header" onclick="toggleCitePanel()">
        <span id="cite-panel-title">Citations &#x2014; loading&#x2026;</span>
        <div id="cite-legend"></div>
        <button id="cite-service-toggle" onclick="event.stopPropagation(); cycleCiteService()" title="Toggle preferred citation service"><span id="cite-svc-label">${CITE_SERVICE_LABELS[citeServicePref]}</span></button><span id="cite-panel-toggle">&#x25be;</span>
      </div>
      <div id="cite-panel-body"></div>
    </div>`;

  resetSummaryPanel();   // collapse/clear summary panel for new document
  updateCiteServiceUI(); // restore toggle label/dot after innerHTML re-created the elements
  // Set filepath AFTER innerHTML (innerHTML wipes dataset)
  document.getElementById('preview-pane').dataset.filepath = r.filepath;
  renderPreviewTags(r.filepath, r.tags || []);
  if (citePanelCollapsed)
    document.getElementById('cite-panel').classList.add('collapsed');

  // Fetch content and citations in parallel
  const [contentData, citeData] = await Promise.all([
    fetch(`${API}/content?id=${r.id}`).then(x => x.json()).catch(() => null),
    fetch(`${API}/citations?id=${r.id}`).then(x => x.json()).catch(() => null),
  ]);

  const body = document.getElementById('preview-body');
  if (body) {
    const terms = query ? queryToTerms(query) : [];
    let docHtml = (contentData && (contentData.html || contentData.text))
      ? (contentData.html || escHtml(contentData.text))
      : '<em>Could not load document.</em>';
    const citations = (citeData && citeData.citations) ? citeData.citations : [];
    window._currentDocId         = r.id;
    window._currentDocCitations  = citations;
    window._currentDocRawHtml    = docHtml;
    window._currentDocTerms      = terms;
    if (citations.length) docHtml = injectCitationLinks(docHtml, citations);
    if (terms.length) docHtml = highlightTerms(docHtml, terms);
    body.innerHTML = `<div id="preview-content">${docHtml}</div>`;
    if (citations.length) autoSaveCaseNames(citations);
    const mark = body.querySelector('mark');
    if (mark) mark.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  renderCitePanel((citeData && citeData.citations) ? citeData.citations : [], r.id);
}

// ── CITATION LINK INJECTION ────────────────────────────────────────────────────
// caseNameByKey: populated during injection, maps key -> extracted full display name
// Used by renderCitePanel and the add-case-name popover for the current session.
const caseNameByKey = {};

function injectCitationLinks(html, citations) {
  if (!citations.length) return html;

  const urlByKey  = {};
  const clsByKey  = {};
  for (const c of citations) {
    urlByKey[c.key]  = resolvedCiteUrl(c);
    clsByKey[c.key]  = resolvedCiteClass(c);
  }
  const sorted = [...citations].sort((a, b) => b.key.length - a.key.length);

  // supraMap: "ShortName\x00reporter" -> { url, cls, display }
  const supraMap = {};

  // ── Pass A: build supraMap by scanning plain text ─────────────────────────
  const plainText = html.replace(/<[^>]+>/g, ' ');
  for (const c of sorted) {
    if (c.type !== 'case') continue;
    const scanPat = new RegExp(
      escapeForRegex(c.key) +
      '(?:,\\s*\\d+(?:[-\u2013]\\d+)?(?:,\\s*\\d+)*)?' +
      '\\s*\\(([A-Z][\\w ]*)\\)', 'g'
    );
    let m;
    while ((m = scanPat.exec(plainText)) !== null) {
      const sk = m[1] + '\x00' + c.reporter;
      if (!supraMap[sk]) supraMap[sk] = {
        url: escHtml(urlByKey[c.key]), cls: clsByKey[c.key], key: c.key
      };
    }
  }

  // ── Pass B: inject supra on whole HTML string (spans <em> tags) ──────────
  // Handles all common supra forms:
  //   (Jordan, supra, 55 Cal.2d at p. 604.)   -- full form with volume+reporter
  //   (Jordan, supra, at p. 604.)              -- no volume+reporter
  //   (Jordan, supra.)  /  (Jordan, supra)     -- no page reference
  //   (<em>Jordan</em>, supra, ...)            -- italicised short name
  for (const [sk, { url, cls, key }] of Object.entries(supraMap)) {
    const [shortName, reporter] = sk.split('\x00');
    const display     = escHtml(caseNameByKey[key] || key);
    const escapedName = escapeForRegex(shortName);
    const escapedRptr = escapeForRegex(reporter);
    const pat = new RegExp(
      '\\((?:<em>)?' + escapedName + '(?:<\\/em>)?' +      // (Jordan  or (<em>Jordan</em>
      ',\\s+(?:<em>)?supra(?:<\\/em>)?' +                  // , supra
      '(?:,\\s+\\d+\\s+' + escapedRptr + ')?' +           // optional: , 55 Cal.2d
      '(?:,?\\s+at\\s+pp?\\.\\s+[\\d,\\s\\-\u2013]+)?' + // optional: at p. 604
      '\\.?\\)', 'g'
    );
    html = html.replace(pat, match =>
      `<a class="${cls}" href="${url}" target="_blank" title="${display}" data-cite-key="${escHtml(key)}">${match}</a>`
    );
  }

  // ── Pass C0: absorb preceding <em> runs into already-linked cite-link tags ──
  // The Lexis extension sometimes links only part of a case name (e.g. the
  // defendant), leaving the plaintiff portion as a preceding <em> run outside
  // the <a> tag. This pass merges them into one link.
  // Input:  <em>Teachers Ins. &amp; Annuity Assn. v. </em><a class="cite-link..."><em>Furlotti</em>...</a>
  // Output: <a class="cite-link..."><em>Teachers Ins. &amp; Annuity Assn. v. </em><em>Furlotti</em>...</a>
  html = html.replace(
    /(<em>[^<]*<\/em>\s*)+(<a\s[^>]*class="([^"]*cite-link[^"]*)"[^>]*>([\s\S]*?)<\/a>)/g,
    (match, _lastEm, fullATag, cls, innerContent) => {
      const aIdx     = match.lastIndexOf('<a ');
      const emPart   = match.slice(0, aIdx);
      const hrefM    = fullATag.match(/href="([^"]*)"/);
      const titleM   = fullATag.match(/title="([^"]*)"/);
      const href     = hrefM  ? hrefM[1]  : '';
      const emText   = emPart.replace(/<[^>]+>/g, '').trim();
      const oldTitle = titleM ? titleM[1] : '';
      const newTitle = emText ? `${emText} ${oldTitle}` : oldTitle;
      return `<a class="${cls}" href="${href}" target="_blank" title="${newTitle}">${emPart}${innerContent}</a>`;
    }
  );

  // ── Pass C: inject full-name links using <em> case name as left anchor ────
  // Pattern: <em>CaseName</em> (YYYY) volume reporter page[, pincite][ (Short)]
  // Prefers stored case_name from repo over auto-extracted <em> text.
  // Also handles partial italics (e.g. only defendant name italic) by trying
  // a plain-text match using the stored case_name when available.
  for (const c of sorted) {
    if (c.type !== 'case') continue;
    const cls        = clsByKey[c.key];
    const url        = escHtml(urlByKey[c.key]);
    const escapedKey = escapeForRegex(c.key);
    const rightPat   = '(?:,\\s*\\d+(?:[-\u2013]\\d+)?(?:,\\s*\\d+)*)?(?:\\s*\\([A-Z][\\w ]*\\))?';

    // If a stored case_name exists, use position-mapping to match the full name
    // across any inline tags (<em>, <strong>) that may split the name in the HTML.
    // Strategy: strip tags to get plain text, match there, map positions back to HTML.
    if (c.case_name) {
      const nameOnly = c.case_name.replace(c.key, '').replace(/\s*\(\d{4}\)\s*$/, '').trim();
      if (nameOnly) {
        const escapedName = escapeForRegex(nameOnly)
          .replace(/&amp;/g, '(?:&amp;|&)')
          .replace(/&(?!amp;)/g, '(?:&amp;|&)');
        const plainPat = new RegExp(
          escapedName + '\\s*\\(\\d{4}\\)\\s+' + escapedKey + rightPat, 'g'
        );
        html = injectByPlainTextMatch(html, plainPat, (inner) =>
          `<a class="${cls}" href="${url}" target="_blank" title="${escHtml(c.case_name)}" data-cite-key="${escHtml(c.key)}">${inner}</a>`
        );
        if (!caseNameByKey[c.key]) caseNameByKey[c.key] = c.case_name;
      }
    }

    // Standard em-anchor pattern
    const leftPat  = '<em>([^<]+)</em>\\s*\\(\\d{4}\\)\\s+';
    const fullPat  = leftPat + escapedKey + rightPat;
    const re       = new RegExp(fullPat, 'g');

    html = html.replace(re, (match, emText) => {
      const yearM = match.match(/\((\d{4})\)/);
      const year  = yearM ? yearM[1] : '';
      const autoName = `${emText} (${year}) ${c.key}`;
      const displayName = c.case_name || autoName;
      if (!caseNameByKey[c.key]) caseNameByKey[c.key] = displayName;
      return `<a class="${cls}" href="${url}" target="_blank" title="${escHtml(displayName)}" data-cite-key="${escHtml(c.key)}">${match}</a>`;
    });
  }

  // ── Pass D: inject bare reporter links (no <em> prefix found) ────────────
  // Only fires where the key hasn't already been wrapped in a link.
  for (const c of sorted) {
    const cls        = clsByKey[c.key];
    const url        = escHtml(urlByKey[c.key]);
    const display    = escHtml(caseNameByKey[c.key] || c.key);
    // Allow optional comma+space before § so 'Code Civ. Proc., § 1032'
    // matches even when the extractor key is 'Code Civ. Proc. § 1032'.
    const escapedKey = escapeForRegex(c.key).replace(/\s*§/g, ',?\\s*§');
    const rightPat   = '(?:,\\s*\\d+(?:[-\u2013]\\d+)?(?:,\\s*\\d+)*)?(?:\\s*\\([A-Z][\\w ]*\\))?';
    const re         = new RegExp(escapedKey + rightPat, 'g');
    const segments   = html.split(/(<[^>]+>)/);
    html = segments.map((seg, i) =>
      i % 2 === 1 ? seg : seg.replace(re, match =>
        `<a class="${cls}" href="${url}" target="_blank" title="${display}" data-cite-key="${escHtml(c.key)}">${match}</a>`
      )
    ).join('');
  }

  // ── Pass E: Ibid/Id — tokenize keeping <em> in text chunks ───────────────
  const ibidPats = [
    /\((?:<em>)?Ibid\.(?:<\/em>)?\)/g,
    /\((?:<em>)?Id\.(?:<\/em>)?\s+at\s+pp?\.\s+[\d,\s\-\u2013]+\.?\)/g,
  ];
  const tokenRe = /(<a\b[^>]*>[\s\S]*?<\/a>|<(?!\/?(?:em|strong)\b)[^>]+>)/g;
  const tokens  = [];
  let pos = 0, tm;
  while ((tm = tokenRe.exec(html)) !== null) {
    if (tm.index > pos) tokens.push({ text: html.slice(pos, tm.index) });
    tokens.push({ tag: tm[0] });
    pos = tm.index + tm[0].length;
  }
  if (pos < html.length) tokens.push({ text: html.slice(pos) });

  let lastUrl = null, lastCls = 'cite-link';
  html = tokens.map(tok => {
    if (tok.tag !== undefined) {
      if (tok.tag.startsWith('<a ') && tok.tag.includes('cite-link')) {
        const hm = tok.tag.match(/href="([^"]*)"/);
        const cm = tok.tag.match(/class="([^"]*)"/);
        if (hm) lastUrl = hm[1];
        if (cm) lastCls = cm[1];
      }
      return tok.tag;
    }
    if (!lastUrl) return tok.text;
    let t = tok.text;
    for (const pat of ibidPats) {
      pat.lastIndex = 0;
      t = t.replace(pat, match =>
        `<a class="${lastCls}" href="${lastUrl}" target="_blank" title="Short citation">${match}</a>`
      );
    }
    return t;
  }).join('');

  // ── Pass F: bare <em>ShortName</em> links ─────────────────────────────────
  // For each short name registered in supraMap, link every <em>ShortName</em>
  // occurrence in the document regardless of surrounding punctuation.
  // Operates on the whole HTML string since the pattern spans the <em> tag.
  for (const [sk, { url, cls, key }] of Object.entries(supraMap)) {
    const [shortName] = sk.split('\x00');
    const display = escHtml(caseNameByKey[key] || key);
    const pat = new RegExp('<em>' + escapeForRegex(shortName) + '<\\/em>', 'g');
    html = html.replace(pat, match =>
      `<a class="${cls}" href="${url}" target="_blank" title="${display}" data-cite-key="${escHtml(key)}">${match}</a>`
    );
  }


  // \u2500\u2500 Pass G: link any unlinked § symbol by code name context \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
  // Catches statute citations the extractor missed (e.g. not in CODES list,
  // or formatted without a recognised code name in the DB).
  // Builds a service-native search URL (toggle-aware) for each match.
  // Only fires on text segments that are not already inside an <a> tag.
  (function() {
    // Code name \u2192 WL/Lexis prefix maps (already declared globally)
    // Build one regex matching any known code name + optional comma + § + section
    const _shortNames = Object.keys(WORKUPS_SHORT_TO_WL);
    const _fullNames  = Object.keys(WORKUPS_FULL_TO_WL);
    const _allNames   = [..._shortNames, ..._fullNames].sort((a, b) => b.length - a.length);
    // Also match HTML-encoded & (&amp;) in code names like 'Bus. & Prof. Code'
    const _codeAlt    = _allNames.map(n => n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/&/g, '(?:&amp;|&)')).join('|');
    const _statRe     = new RegExp(
      '(' + _codeAlt + ')' +                    // short abbrev or full name
      '(?:,?\\s*§§?\\s*|\\s+section\\s+)' +  // §/§§ or word 'section'
      '(\\d[\\w\\.\\-]*)',                          // section number
      'gi'
    );

    // Split on tags, only operate on text segments not already in an <a>
    const segs = html.split(/(<[^>]+>)/);
    let inAnchor = 0;
    html = segs.map((seg, i) => {
      if (i % 2 === 1) {
        // Tag segment
        if (/^<a[\s>]/i.test(seg))  inAnchor++;
        if (/^<\/a>/i.test(seg))    inAnchor = Math.max(0, inAnchor - 1);
        return seg;
      }
      if (inAnchor > 0 || (!seg.includes('§') && !/section\s/i.test(seg))) return seg;
      _statRe.lastIndex = 0;
      return seg.replace(_statRe, (match, codeName, section) => {
        // Strip trailing punctuation from section number
        const sec     = section.replace(/[.,;)]+$/, '');
        const codeKey = codeName.replace(/&amp;/g, '&');  // un-escape HTML entity
        const wlPfx   = WORKUPS_SHORT_TO_WL[codeKey] || WORKUPS_FULL_TO_WL[codeKey];
        const lxPfx   = WORKUPS_SHORT_TO_LEXIS[codeKey] || WORKUPS_FULL_TO_LEXIS[codeKey];
        const wlTerm = wlPfx   ? wlPfx   + ' § ' + sec : codeKey + ' § ' + sec;
        const lxTerm = lxPfx   ? lxPfx   + ' § ' + sec : codeKey + ' § ' + sec;
        const href   = (citeServicePref === 'westlaw')
          ? 'https://1.next.westlaw.com/Search/Results.html?query=' + encodeURIComponent(wlTerm) + '&jurisdiction=CA&contentType=STATUTE'
          : 'https://plus.lexis.com/search/?pdmfid=1530671&pdsearchterms=' + encodeURIComponent(lxTerm);
        const title  = escHtml(codeName + ' § ' + sec);
        const cls    = (citeServicePref === 'westlaw') ? 'cite-link' : 'cite-link';
        return `<a class="${cls}" href="${href}" target="_blank" title="${title}">${match}</a>`;
      });
    }).join('');
  })();

  return html;
}

// Case-name persistence was removed with the citation repo. The extractor now
// returns accurate names; any in-session manual edits live in caseNameByKey
