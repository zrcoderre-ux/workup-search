// Match a regex against tag-stripped plain text, then map positions back to
// the original HTML and wrap the corresponding HTML span with the replacer's output.
// This correctly handles case names split across multiple <em> runs.
function injectByPlainTextMatch(html, plainPat, replacer) {
  // Build plain text and a mapping: plainPos -> htmlPos
  const htmlPositions = [];
  let i = 0;
  let plain = '';
  while (i < html.length) {
    if (html[i] === '<') {
      const end = html.indexOf('>', i);
      if (end === -1) break;
      i = end + 1;
    } else {
      htmlPositions.push(i);
      plain += html[i];
      i++;
    }
  }
  // Collect all matches in plain text
  const matches = [];
  let m;
  plainPat.lastIndex = 0;
  while ((m = plainPat.exec(plain)) !== null) {
    const pStart = m.index;
    const pEnd   = m.index + m[0].length;
    const hStart = htmlPositions[pStart];
    const hEnd   = pEnd < htmlPositions.length ? htmlPositions[pEnd] : html.length;
    matches.push({ hStart, hEnd });
  }
  // Apply replacements in reverse order so indices stay valid
  for (let j = matches.length - 1; j >= 0; j--) {
    const { hStart, hEnd } = matches[j];
    const inner = html.slice(hStart, hEnd);
    html = html.slice(0, hStart) + replacer(inner) + html.slice(hEnd);
  }
  return html;
}

function replaceInTextSegments(html, pattern, replacer) {
  const re = new RegExp(pattern, 'g');
  const segments = html.split(/(<[^>]+>)/);
  return segments.map((seg, i) => i % 2 === 1 ? seg : seg.replace(re, replacer)).join('');
}

function escapeForRegex(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function renderCitePanel(citations, docId) {

  const sources = [...new Set(citations.map(c => c.source))].filter(s => s !== 'auto' && s !== 'google_scholar');
  legend.innerHTML = sources.map(s => {
    const lm = CITE_LEGEND_MAP[s] || { color: 'var(--ink-mute)', label: s };
    return `<span class="legend-item"><span class="legend-dot" style="background:${lm.color}"></span>${lm.label}</span>`;
  }).join('');
  bodyEl.innerHTML = '';
  for (const c of citations) {
    const resolvedCls = resolvedCiteClass(c);
    // Use extracted case name if available; fall back to stored case_name, then key
    const displayName = caseNameByKey[c.key] || c.case_name || c.key;

    const row = document.createElement('div');

    let nameSpan;

      nameSpan = document.createElement('a');
      nameSpan.className = 'cite-key cite-key-link';
      nameSpan.title     = displayName;

    } else {
      nameSpan = document.createElement('a');
      nameSpan.className = 'cite-key cite-key-link';
      nameSpan.title     = displayName;
      nameSpan.textContent = displayName;
      nameSpan.href      = resolvedCiteUrl(c);
      nameSpan.target    = '_blank';
    }

    const badge   = document.createElement('span');
    badge.className = `cite-badge ${c.type}`;

// Inline name editing: replace the cite-key span with an input
function startNameEdit(nameSpan, c, docId) {
  const row   = nameSpan.closest('.cite-row');
  const input = document.createElement('input');
  input.type      = 'text';
  input.className = 'cite-name-input';
  input.value     = nameSpan.textContent;
  input.title     = 'Edit the display name and linked span. Press Enter to save.';

  const saveBtn   = document.createElement('button');
  saveBtn.className   = 'cite-name-save';
  saveBtn.textContent = 'Save';

  const cancelBtn   = document.createElement('button');
  cancelBtn.className   = 'cite-name-cancel';
  cancelBtn.textContent = 'Cancel';

  nameSpan.replaceWith(input);
  // Insert save/cancel before the open button
  const openBtn2 = row.querySelector('.cite-open-btn');
  row.insertBefore(saveBtn,   openBtn2);
  row.insertBefore(cancelBtn, openBtn2);

  input.focus();
  input.select();

  async function commitNameEdit() {
    const newName = input.value.trim();
    if (newName && newName !== (caseNameByKey[c.key] || c.case_name || c.key)) {
      // Clear cached name so Pass C picks up the fresh value from the repo
      delete caseNameByKey[c.key];
      await fetch(`${API}/cite_name`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key: c.key, case_name: newName })
      }).catch(() => {});
      // Re-fetch citations (server now returns updated case_name) and re-render
      const contentData = await fetch(`${API}/content?id=${docId}`).then(x => x.json()).catch(() => null);
      const citeData    = await fetch(`${API}/citations?id=${docId}`).then(x => x.json()).catch(() => null);
      if (contentData && citeData) {
        const citations = citeData.citations || [];
        // Patch case_name from in-memory map so Pass C links the full name immediately.
        citations.forEach(ct => {
          if (ct.type === 'case' && caseNameByKey[ct.key]) ct.case_name = caseNameByKey[ct.key];
        });
        let docHtml = contentData.html || '';
        if (citations.length) docHtml = injectCitationLinks(docHtml, citations);
        const body = document.getElementById('preview-body');
        if (body) body.innerHTML = `<div id="preview-content">${docHtml}</div>`;
        renderCitePanel(citations, docId);
      }
    } else {
      cancelNameEdit();
    }
  }

  function cancelNameEdit() {
    input.replaceWith(nameSpan);
    saveBtn.remove();
    cancelBtn.remove();
  }

  saveBtn.addEventListener('click',   commitNameEdit);
  cancelBtn.addEventListener('click', cancelNameEdit);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter')  commitNameEdit();
    if (e.key === 'Escape') cancelNameEdit();
  });
}

function renderPreviewTags(filepath, tags) {
  const row = document.getElementById('preview-tag-row');
  if (!row) return;
  row.innerHTML = '';

  tags.forEach(t => {
    const info  = allTags[t] || { color_index: 0 };
    const color = tagColor(info.color_index);
    const pill  = document.createElement('span');
    pill.className = 'preview-tag-pill';
    pill.style.background = color;
    pill.dataset.filepath = filepath;
    pill.dataset.tagName  = t;
    pill.innerHTML = `${escHtml(t)} <button class="preview-tag-remove" data-remove-preview-tag="${escHtml(t)}" title="Remove tag">✕</button>`;
    row.appendChild(pill);
  });

  // Add-tag input
  const wrap  = document.createElement('div');
  wrap.id     = 'tag-add-wrap';
  wrap.innerHTML = `
    <input id="tag-add-input" type="text" placeholder="＋ Add tag…" autocomplete="off" spellcheck="false">
    <div id="tag-autocomplete"></div>`;
  row.appendChild(wrap);

  // Wire up the input
  const input = document.getElementById('tag-add-input');
  const acBox = document.getElementById('tag-autocomplete');

  input.addEventListener('input', () => showTagAutocomplete(input, acBox, filepath, tags));
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const val = input.value.trim();
      if (val) commitTag(filepath, val, input, acBox);
    }
    if (e.key === 'Escape') { input.value = ''; hideAutocomplete(acBox); }
  });
  input.addEventListener('blur', () => setTimeout(() => hideAutocomplete(acBox), 150));
}

function showTagAutocomplete(input, acBox, filepath, currentTags) {
  const q       = input.value.trim().toLowerCase();
  const existing = new Set(currentTags);
  const matches = Object.keys(allTags)
    .filter(n => !existing.has(n) && (q === '' || n.toLowerCase().includes(q)))
    .slice(0, 8);

  acBox.innerHTML = '';
  matches.forEach(name => {
    const info  = allTags[name];
    const color = tagColor(info.color_index);
    const item  = document.createElement('div');
    item.className = 'tag-ac-item';
    item.innerHTML = `<span class="ac-dot" style="background:${color}"></span>${escHtml(name)}`;
    item.onmousedown = () => commitTag(filepath, name, input, acBox);
    acBox.appendChild(item);
  });

  // "Create new tag" option if typed value isn't an exact existing tag
  const exactMatch = Object.keys(allTags).some(n => n.toLowerCase() === q);
  if (q && !exactMatch) {
    const item = document.createElement('div');
    item.className = 'tag-ac-item new-tag';
    item.innerHTML = `<span class="ac-dot" style="background:#aaa"></span>Create "${escHtml(q)}"`;
    item.onmousedown = () => commitTag(filepath, input.value.trim(), input, acBox);
    acBox.appendChild(item);
  }

  acBox.classList.toggle('visible', acBox.children.length > 0);
}

function hideAutocomplete(acBox) {
  acBox.classList.remove('visible');
}

async function commitTag(filepath, tagName, input, acBox) {
  if (!tagName) return;
  input.value = '';
  hideAutocomplete(acBox);

  try {
    const url  = `${API}/tag/set?filepath=${encodeURIComponent(filepath)}&tag=${encodeURIComponent(tagName)}&action=add`;
    const data = await fetch(url).then(r => r.json());
    if (!data.ok) { console.error('Tag set failed'); return; }

    // Refresh tag registry and re-render everything
    await loadTagSidebar();
    renderPreviewTags(filepath, data.tags);
    refreshCardTags(filepath, data.tags);
  } catch(e) { console.error(e); }
}

async function removePreviewTag(filepath, tagName) {
  try {
    const url  = `${API}/tag/set?filepath=${encodeURIComponent(filepath)}&tag=${encodeURIComponent(tagName)}&action=remove`;
    const data = await fetch(url).then(r => r.json());
    if (!data.ok) { console.error('Tag remove failed'); return; }

    await loadTagSidebar();
    renderPreviewTags(filepath, data.tags);
    refreshCardTags(filepath, data.tags);

    // If we were filtering by this tag and it's now gone from allTags, clear that filter
    if (!allTags[tagName] && activeTagFilters.has(tagName)) {
      activeTagFilters.delete(tagName);
      updateChips();
      reloadWithFilters();
    }
  } catch(e) { console.error(e); }
}

// Update the tag pills on the matching result card without a full re-render
function refreshCardTags(filepath, tags) {
  // Update allResults in-memory so sort/filter stays correct
  allResults.forEach(r => { if (r.filepath === filepath) r.tags = tags; });

  // Update the visible card if it's currently in the list
  const card = document.querySelector(`.result-card[data-filepath="${CSS.escape(filepath)}"]`);
  if (!card) return;
  const existing = card.querySelector('.rc-tags');
  if (existing) existing.remove();
  if (tags.length > 0) {
    const tagDiv = document.createElement('div');
    tagDiv.className = 'rc-tags';
    tagDiv.innerHTML = tags.map(t => {
      const info  = allTags[t] || { color_index: 0 };
      const color = tagColor(info.color_index);
      return `<span class="rc-tag-pill" style="background:${color}">${escHtml(t)}</span>`;
    }).join('');
    card.appendChild(tagDiv);
  }
}

// ── HELPERS ───────────────────────────────────────────────────────────────────
function queryToTerms(query) {
  if (!query) return [];
  const s = query.trim();
  if (s.startsWith('"') && s.endsWith('"') && s.length > 2) return [s.slice(1, -1)];
  return s.split(/\s+/);
}

function highlightTerms(html, terms) {
  terms.filter(t => t.length > 2).forEach(term => {
    const safe = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    html = html.replace(new RegExp(`(${safe})`, 'gi'), '<mark>$1</mark>');
  });
  return html;
}

function escHtml(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── DRAG-TO-RESIZE ────────────────────────────────────────────────────────────
(function() {
  function makeDragger(handleId, getLeft, getRight, minLeft, minRight, applyLeft, applyRight) {
    const handle = document.getElementById(handleId);
    if (!handle) return;
    let startX, startLeftW, startRightW;
    handle.addEventListener('mousedown', e => {
      e.preventDefault();
      startX      = e.clientX;
      startLeftW  = getLeft().offsetWidth;
      startRightW = getRight().offsetWidth;
      handle.classList.add('dragging');
      document.body.style.cursor     = 'col-resize';
      document.body.style.userSelect = 'none';

      function onMove(e) {
        const dx       = e.clientX - startX;
        const newLeft  = Math.max(minLeft,  startLeftW  + dx);
        const newRight = Math.max(minRight, startRightW - dx);
        applyLeft(newLeft);
        applyRight(newRight);
      }
      function onUp() {
        handle.classList.remove('dragging');
        document.body.style.cursor     = '';
        document.body.style.userSelect = '';
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup',   onUp);
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup',   onUp);
    });
  }

  makeDragger(
    'handle-sidebar',
    () => document.getElementById('sidebar'),
    () => document.getElementById('main'),
    140, 400,
    w  => { document.getElementById('sidebar').style.width = w + 'px'; },
    _w => {}
  );

  makeDragger(
    'handle-results',
    () => document.getElementById('results-pane'),
    () => document.getElementById('preview-pane'),
    160, 200,
    w  => { document.getElementById('results-pane').style.width = w + 'px'; },
    _w => {}
  );
})();

  <div class="cep-title" id="cep-title">ADD CASE NAME</div>
  <div class="cep-key" id="cep-key-display"></div>
  <div class="cep-label" id="cep-label">Case name (as it should appear in links)</div>
  <input class="cep-input" id="cep-url-input" type="text" placeholder="e.g. Baker v. Italian Maple Holdings, LLC (2017) 13 Cal.App.5th 1152" spellcheck="false">
  <div class="cep-actions">
    <button class="cep-cancel" id="cep-cancel-btn">Cancel</button>
    <button class="cep-save"   id="cep-save-btn">Save</button>
  </div>
  <div class="cep-msg" id="cep-msg"></div>
</div>
<div id="sum-tooltip"></div>
</body>
